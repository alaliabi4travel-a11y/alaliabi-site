وجك، ارفع مستنداتك من هاتفك، واستلم رقم طلبك فوراً. نتابع معك خطو بخطوة","tripsTitle":"الأفواج المتاحة","tripsSub":"تظهر هنا الأفواج القادمة فقط، مرتبة حسب تاريخ السفر.","howTitle":"طريقة التقديم","howSub":"أربع خطوات من هاتفك","steps":[{"t":"اختر الفوج","p":"حدد الفوج المناسب حسب التاريخ ونوع السفر."},{"t":"ارفع المستندات","p":"صورة الجواز والصورة الشخصية وأي مستند آخر مطلوب."},{"t":"استلم رقم الطلب","p":"يظهر لك رقم خاص بطلبك، احتفظ به للمتابعة."},{"t":"أرسل طلبك","p":"أرسل تفاصيل طلبك ومستنداتك على واتساب بضغطة زر."}],"faq":[{"q":"ما الفرق بين الفوج الجوي والفوج البحري؟","a":"الفوج الجوي يسافر بالطيران وهو أسرع. الفوج البحري يسافر بالباخرة إلى ميناء جدة، وهو أوفر في التكلفة ويأخذ وقتاً أطول."},{"q":"ما المستندات المطلوبة؟","a":"صورة واضحة من الجواز صالح لستة أشهر على الأقل، قد نطلب مستندات إضافية حسب حالتك."},{"q":"كيف أتابع طلبي بعد التقديم؟","a":"أرسل رقم طلبك على واتساب في أي وقت، وسيرد عليك فريقنا بآخر حالة للطلب."},{"q":"هل يمكنني تغيير الفوج بعد التقديم؟","a":"نعم، ما دامت هناك مقاعد متاحة في الفوج الجديد . تواصل معنا برقم طلبك."}],"pay":[{"t":"استلام ريال كاش في مكة","p":"نستلم المبلغ في مكة العزيزية بواسطة مندوبنا"},{"t":"تحويل بنكي","p":"تحيويل جنيه على حسب سعر شراء الريال"}]},"trips":[{"id":"F101","name":"فوج عمرة طيران 9 أكتوبر","type":"air","depart":"2026-10-09","ret":"2026-10-23","from":"بورتسودان","to":"جدة","seats":42,"left":12,"price":"3060 ريال","status":"مكتمل"},{"id":"F102","name":"فوج عمرة بحري 8 أكتوبر ","type":"sea","depart":"2026-10-08","ret":"2026-11-23","from":"سواكن","to":"جدة","seats":42,"left":28,"price":"2660","status":"متاح حالياً"},{"id":"F103","name":"فوج عمرة طيران 28 أكتوبر","type":"air","depart":"2026-10-28","ret":"2026-11-11","from":"بورتسودان","to":"جدة","seats":42,"left":42,"price":"يحدد لاحقا","status":"لم يبدأ التسجيل"},{"id":"F104","name":"فوج عمرة بحر 25 أكتوبر","type":"sea","depart":"2026-10-25","ret":"2026-12-22","from":"سواكن","to":"جدة","seats":42,"left":42,"price":"يُحدد لاحقا","status":"لم يبدأ التسجيل"}],"home":{"t {delBtn("reviews",i)}</span></div>        <div class="adm-grid">          ${inp("اسم العميل",`reviews.${i}.name`)}          ${inp("المدينة",`reviews.${i}.city`)}          ${inp("الخدمة",`reviews.${i}.service`,{options:[["",""],["تأشيرة عمرة","تأشيرة عمرة"],["فوج عمرة جوي","فوج عمرة جوي"],["فوج عمرة بحري","فوج عمرة بحري"]]})}          ${inp("التقييم",`reviews.${i}.stars`,{type:"number",options:[[5,"★★★★★"],[4,"★★★★"],[3,"★★★"],[0,"بدون نجوم"]]})}        </div>        <div style="height:10px"></div>${inp("نص التعليق",`reviews.${i}.text`,{area:true,rows:3})}      </div>`).join("")}    ${addBtn("reviews","إضافة تعليق")}`;  return `<div class="adm-note">      <p><b>أين تصلك الطلبات؟</b> عندما يقدّم العميل، يحصل على رقم طلب ثم يرسل طلبه كاملاً إليك على واتساب (${esc(draft.contact.whatsapp)})، ويرفق المستندات في نفس المحادثة.</p>      <p>أرقام طلبات التأشيرة تبدأ بـ <b dir="ltr">UV-</b>، وأرقام طلبات الأفواج تبدأ بـ <b dir="ltr">AF-</b>. ابحث بها في واتساب لتجد أي طلب بسرعة.</p>      <p>لا تُحفظ الطلبات داخل الموقع نفسه، لأن الموقع صفحة عامة ولا يصح أن تُخزَّن فيها أرقام الجوازات وصور العملاء.</p>    </div>`;}function validDraft(){  for(const t of draft.trips){    if(!String(t.name).trim()) return "في فوج بدون اسم.";    if(!t.depart||!t.ret) return `أكمل تاريخ السفر والعودة لـ «${t.name}».`;    if(d(t.ret)<d(t.depart)) return `تاريخ العودة قبل تاريخ السفر في «${t.name}».`;    if(Number(t.left)>Number(t.seats)) return `المقاعد المتبقية أكثر من عدد المقاعد في «${t.name}».`;  }  if(!/^\d{8,15}$/.test(String(draft.contact.whatsapp).replace(/\D/g,""))) return "رقم واتساب غير صحيح.";  if(draft.visa.priceNum!==""&&!(Number(draft.visa.priceNum)>=0)) return "سعر التأشيرة يجب أن يكون رقماً.";  if(!String(draft.visa.title).trim()) return "عنوان التأشيرة فارغ.";  return "";}function buildDocument(state){  const RESET="*,*::before,*::after{box-sizing:border-box}body{margin:0}";  const json=o=>JSON.stringify(o).replace(/</g,"\\u003c");  const SC="<"+"/script>";  const head="<title>العال (["not_writer","not_granted","consent_required","capability_disabled"].includes(code)) msg("ليست لديك صلاحية تعديل هذا الموقع.",true);    else if(code==="rate_limited") msg("نشرت كثيراً في وقت قصير. انتظر دقيقة ثم حاول.",true);    else if(code==="too_large") msg("حجم الموقع أكبر من المسموح.",true);    else msg("تعذّر النشر، حاول مرة أخرى بعد قليل.",true);  }}/* ============ لوحة الإدارة على الموقع ============ */const IS_ADM=/^\/admin\/?$/.test(location.pathname)||location.hash==="#admin";const GH_DEFAULT_REPO="", GH_KEY="alaliabi-gh";let gh=null;function ghLoad(){try{return JSON.parse(localStorage.getItem(GH_KEY)||"null");}catch(e){return null;}}function ghSave(o){try{o?localStorage.setItem(GH_KEY,JSON.stringify(o)):localStorage.removeItem(GH_KEY);}catch(e){}}async function ghApi(p,o={}){  const r=await fetch("https://api.github.com"+p,{cache:"no-store",...o,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token}});  if(!r.ok){const e=new Error("gh");e.status=r.status;throw e;}  return r.json();}const b64enc=s=>{const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=32768)o+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(o);};const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));async function ghGet(f){try{const r=await ghApi(`/repos/${gh.repo}/contents/${f}?t=${Date.now()}`);return {sha:r.sha,text:b64dec(r.content)};}catch(e){if(e.status===404)return null;throw e;}}const ghPut=(f,text,sha,message)=>ghApi(`/repos/${gh.repo}/contents/${f}`,{method:"PUT",body:JSON.stringify(sha?{message,content:b64enc(text),sha}:{message,content:b64enc(text)})});function withData(html,state){  const re=/(<script type="application\/json" id="site-data">)[\s\S]*?(<\/script>)/;  if(!re.test(html)) throw new Error("no-data");  const j=JSON.stringify(state).replace(/</g,"\\u003c");  return html.replace(re,(m,a,c)=>a+j+c);}async function ghCheck(){const r=await ghApi(`/repos/${g eplace(/\/+$/,""), token=val("#ghTok"), b=e.target.querySelector("button");    if(!repo||!token){$("#ghErr").textContent="أكمل البيانات.";return;}    gh={repo,token}; b.disabled=true;    try{await ghCheck(); ghSave(gh); dlg.close(); canAdmin=true; renderSite(); openAdmin();}    catch(x){gh=null; b.disabled=false; $("#ghErr").textContent=x.status===401?"مفتاح الدخول غير صحيح.":(x.status===403||x.status===404)?"لا توجد صلاحية على هذا المستودع.":"تعذّر الاتصال، حاول مرة أخرى.";}  };  dlg.showModal();}async function ghBoot(){  if(!IS_ADM||window.claude) return;  document.head.insertAdjacentHTML("beforeend",'<meta name="robots" content="noindex">');  const s=ghLoad();  if(s&&s.repo&&s.token){gh=s; try{await ghCheck(); canAdmin=true; renderSite(); openAdmin(); return;}catch(e){gh=null; if(e.status===401) ghSave(null); return ghLogin(e.status===401?"انتهت صلاحية مفتاح الدخول، أدخل مفتاحاً جديداً.":"تعذّر الاتصال، حاول مرة أخرى.");}}  ghLogin("");}/* ============ التشغيل ============ */renderSite();ghBoot();(async()=>{  try{    if(!window.claude||!window.claude.use) return;    const [user, art] = await Promise.all([window.claude.use("user"), window.claude.use("artifact")]);    artifactApi=art;    const ok = user ? ((await user.isOwner()) || (await user.canEdit())) : false;    if(ok && art){ canAdmin=true; renderSite(); if(location.hash==="#admin") openAdmin(); }  }catch(e){}})();</script><script>try{const L=JSON.parse(document.getElementById("site-logos").textContent);document.head.insertAdjacentHTML("beforeend",'<link rel="icon" href="'+L.logoBig+'"><link rel="apple-touch-icon" href="'+L.logoBig+'">');}catch(e){}</script><script>addEventListener("message",e=>{if(e.origin==="https://app.netlify.com"&&e.data==="alaliabi-getsrc"){fetch(location.pathname,{cache:"no-store"}).then(r=>r.text()).then(t=>e.source.postMessage({alaliabiSrc:t},e.origin));}});</script></body></html>
